# Catalyst Anticipation Swing Bot -- tunable configuration
# Thresholds live here so gates stay declarative and the backtest can sweep them.

universe: sp500

# Gate 1 -- liquidity
liquidity_min_dollar_volume: 5000000    # avg daily $ volume floor
min_price: 5                            # min share price

# Gate 0 -- market regime
regime:
  vix_max: 30                           # no alerts when VIX above this
  spx_ma_days: 200                      # SPX must be above this MA
  breadth_ma_days: 50                   # % of S&P above this MA (informational)

# Gate 2 -- trend
trend:
  ma_days: 200
  ma_slope_lookback: 21                 # trading days used to measure MA slope
  base_max_atr_pct: 0.05                # "tight base" = ATR/price below this

# Gate 5 -- setups
setups:
  pullback_ma_days: 50
  pullback_proximity_pct: 0.04          # within +/-4% of rising 50-day MA
  vcp_lookback: 50                      # window to detect volatility contraction
  breakout_lookback: 50                 # window for prior high / base
  breakout_volume_mult: 1.5             # breakout volume vs avg

# Data
data:
  history_years: 3

# Hybrid voting funnel -- which gates BLOCK vs VOTE, the pass threshold,
# the alert cap, and the per-voter default weights (overridden by anything
# learned in .state/gate_weights.json once the tuner has data).
funnel:
  vote_threshold: 7.0       # tighter = fewer, higher-conviction alerts
  max_alerts: 2             # hard cap on alerts per night
  guardrails:               # failing any of these = immediate reject
    - g1_liquidity
    - g5_setups
    - g5.5_valuation
    - g7_earnings_block
  voters:                   # weighted vote; never block alone
    - g2_trend
    - g2.5_macro
    - g3_sector
    - g4_rel_strength
    - g5.3_priced_in
    - g6_volume_flow
    - g5.7_fundamentals
    - g7.5_earnings_quality
    - g6.5_smart_money
    - g6.7_short_pressure
    - g6.8_options_flow
  default_weights:
    g2_trend: 1.2
    g4_rel_strength: 1.2
    g3_sector: 0.9
    g2.5_macro: 1.0
    g5.3_priced_in: 1.0
    g6_volume_flow: 1.0
    g5.7_fundamentals: 1.1
    g7.5_earnings_quality: 1.0
    g6.5_smart_money: 0.8
    g6.7_short_pressure: 0.9
    g6.8_options_flow: 0.9

# LLM layer (Phase 5) -- keys come from .env, never hardcoded
llm:
  deepseek_model: deepseek-chat
  claude_model: claude-opus-4-7
  monthly_cost_cap_usd: 20.0     # hard cap; calls refused once exceeded
  max_finalists: 16              # LLM runs only on this many survivors
  news_lookback_days: 14

# Backtest
backtest:
  universe_size: 40        # number of S&P names to replay (subset for speed)
  step_days: 5             # evaluate gates every N trading days
  hold_days: 90            # forward holding window (calendar days)
  slippage_pct: 0.001      # 0.1% slippage applied each side
  target_pct: 0.20         # +20% target (V2; was 0.15)
  min_history_bars: 260    # require ~1y history before first eval

# ---- V2: finalist enrichment gates (OpenBB free data) ----
short_pressure:
  trend_sessions: 10          # short-volume trend window (sessions)
  trend_delta: 0.10           # relative change treated as rising/falling
  dtc_squeeze_min: 5.0        # days-to-cover >= this = squeeze fuel
  squeeze_fund_min: 7.0       # g5.7 score needed for the squeeze bonus
options_flow:
  min_total_volume: 200       # thinner options market -> neutral pass
  call_put_bull: 2.0          # call/put volume ratio >= this -> bullish boost
  call_put_bear: 0.5          # call/put volume ratio <= this -> bearish penalty
priced_in:
  lookback_days: 21
  run_up_max: 0.10
  edge_confirm_ratio: 0.6     # implied move < 60% of target -> edge bonus
insider:
  window_days: 60
  cluster_buys: 2             # >= this many buys (and no sells) -> boost
  heavy_sells: 3              # sells >= this and > buys -> penalty

# ---- V2: debate / review / digest / playbook ----
debate:
  min_conviction: 6           # judge conviction (1-10) below this -> no buy
  min_p_target: 0.35          # p(+target/90d) below this -> watchlist only
position_review:
  min_flags: 2                # red flags needed before the judge is asked
  trend_break_pct: 0.03       # close below 50DMA by more than this = flag
  catalyst_grace_days: 5      # catalyst passed N days ago without move = flag
  short_spike_ratio: 1.5      # latest short% vs median above this = flag
digest:
  watchlist_size: 3
playbook:
  max_lessons: 40             # compaction cap for .state/playbook.md
